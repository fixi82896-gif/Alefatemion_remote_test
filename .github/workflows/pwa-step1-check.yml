name: PWA Step1 browser verification
on:
  push:
    branches: [pwa-step1-fix-banner-back-20260928]
    paths:
      - '.github/workflows/pwa-step1-check.yml'
      - '.github/step1-browser-check.cjs'
      - 'pwa/**'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax
        run: |
          npm run check
          node --check pwa/app-step1-fix.js
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/step1-deps" playwright@1.51.1
          "$RUNNER_TEMP/step1-deps/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser regressions
        run: NODE_PATH="$RUNNER_TEMP/step1-deps/node_modules" node .github/step1-browser-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step1-browser-results
          path: step1-results/
          retention-days: 7
