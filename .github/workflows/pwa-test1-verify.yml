name: PWA Test 2 - Verify

on:
  push:
    branches:
      - pwa-test1-20260927
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pwa-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          ref: pwa-test1-20260927
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Syntax check Test 2 source
        run: npm run check

      - name: Verify Test 2 wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'app-test2.css' pwa/index.html
          grep -q 'app-radio.js' pwa/index.html
          grep -q 'app-auth.js' pwa/index.html
          grep -q 'قوانین حساب و دستگاه‌های متصل' pwa/index.html
          grep -q 'PWA Test 2' pwa/index.html
          grep -q 'PWA Test 2' pwa-server-test2.js
          grep -q 'identity-test.alefatemion.ir' package.json
          grep -q 'alefatemion-pwa-test2' pwa/sw.js

      - name: Smoke test server
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/pwa-test2.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/tmp/health.json; then
              break
            fi
            sleep 0.5
          done
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"version":"PWA Test 2"' /tmp/health.json
          grep -q '"version_code":2' /tmp/health.json
          curl -fsS http://127.0.0.1:3000/ >/tmp/index.html
          grep -q 'PWA Test 2' /tmp/index.html
          curl -fsS http://127.0.0.1:3000/app-auth.js >/dev/null
          curl -fsS http://127.0.0.1:3000/app-radio.js >/dev/null
          curl -fsS http://127.0.0.1:3000/app-test2.css >/dev/null
