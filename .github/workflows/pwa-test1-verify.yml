name: PWA Test 2 - Verify

on:
  push:
    branches:
      - pwa-test1-20260927
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pwa-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: pwa-test1-20260927
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Restore reviewed Android 21 parity bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .github/pwa-test2-bundle.part1 \
              .github/pwa-test2-bundle.part2 \
              .github/pwa-test2-bundle.part3 \
              .github/pwa-test2-bundle.part4 \
            | base64 --decode > /tmp/pwa-test2.tgz
          tar -xzf /tmp/pwa-test2.tgz

      - name: Syntax check before commit
        run: npm run check

      - name: Commit coherent Test 2 source if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pwa pwa-server.js package.json
          if ! git diff --cached --quiet; then
            git commit -m 'PWA Test 2: Android 21 parity pass'
            git push origin HEAD:pwa-test1-20260927
          fi

      - name: Smoke test server
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/pwa-test2.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/tmp/health.json; then
              break
            fi
            sleep 0.5
          done
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"version":"PWA Test 2"' /tmp/health.json
          curl -fsS http://127.0.0.1:3000/ >/tmp/index.html
          grep -q 'PWA Test 2' /tmp/index.html
          grep -q 'قوانین حساب و دستگاه‌های متصل' /tmp/index.html
