name: ZZ - Prune Test announcements older than 7 days

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-prune-7day-announcements.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prune old active content
        run: python .github/scripts/tmp_prune_7day_announcements.py
      - name: Commit cleaned Test remote
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app-config.json notification-feed.json; then
            echo "No old active content needed cleanup."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-config.json notification-feed.json
          git diff --cached --check
          git commit -m "Prune Test announcements older than seven days"
          git push origin HEAD:main
