name: Cleanup obsolete PWA branches

on:
  push:
    branches:
      - pwa-test4-clean-parity-20260928
    paths:
      - .github/workflows/cleanup-obsolete-pwa-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete obsolete test branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "pwa-test3-before-scroll-hotfix-20260928"
            "pwa-test3-parity-20260928"
            "pwa-test3-parity-dev2-backup"
            "pwa-test3-parity-dev2-live"
            "pwa-test3-parity-dev2-work"
            "pwa-test3-parity-dev2"
            "pwa-test3-parity-final"
            "pwa-test3-parity-staging"
            "pwa-test3-parity-working"
            "pwa-test3-runtime-scroll-fix"
            "backup-before-test3-branch-cleanup-20260928"
            "cleanup-test3-temp"
            "cleanup-test3-workflow-holder"
            "pwa-test4-clean-parity-20260928-temp-for-cleanup"
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done
