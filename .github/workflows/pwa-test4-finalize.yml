name: PWA Test 4 - Clean Finalize

on:
  push:
    branches:
      - pwa-test4-clean-parity-20260928
    paths:
      - .github/workflows/pwa-test4-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: pwa-test4-clean-parity-20260928
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Finalize Test 4 metadata and cache
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['version'] = '1.0.0-test.4'
          package['description'] = 'Al Fatemiun PWA Test 4 - clean Android 21 parity client'
          package['scripts']['check'] = "node --check pwa-server-test2.js && node --check pwa-radio-resolver.js && node --check pwa/app-core.js && node --check pwa/app-content.js && node --check pwa/app-account.js && node --check pwa/app-radio.js && node --check pwa/app-platform-parity.js && node --check pwa/app-test4.js && node --check pwa/app-auth.js"
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          server_path = Path('pwa-server-test2.js')
          server = server_path.read_text(encoding='utf-8')
          server = server.replace("const VERSION_NAME = 'PWA Test 2';", "const VERSION_NAME = 'PWA Test 4';")
          server = server.replace('const VERSION_CODE = 2;', 'const VERSION_CODE = 4;')
          server = server.replace("'User-Agent':'Alefatemion-PWA-Test2'", "'User-Agent':'Alefatemion-PWA-Test4'")
          server = server.replace("console.error('[pwa-test2]'", "console.error('[pwa-test4]'")
          server_path.write_text(server, encoding='utf-8')

          sw = """const CACHE='alefatemion-pwa-test4-v1';
          const V='test4-1';
          const SHELL=[
            '/',
            '/index.html',
            `/app.css?v=${V}`,
            `/app-test2.css?v=${V}`,
            `/app-test4.css?v=${V}`,
            `/app-core.js?v=${V}`,
            `/app-content.js?v=${V}`,
            `/app-account.js?v=${V}`,
            `/app-radio.js?v=${V}`,
            `/app-platform-parity.js?v=${V}`,
            `/app-test4.js?v=${V}`,
            `/app-auth.js?v=${V}`,
            `/brand-logo.webp?v=${V}`,
            `/icon.svg?v=${V}`,
            `/manifest.webmanifest?v=${V}`
          ];
          self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(SHELL)).then(()=>self.skipWaiting())));
          self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
          self.addEventListener('fetch',e=>{
            const u=new URL(e.request.url);
            if(e.request.method!=='GET'||u.pathname.startsWith('/api/')) return;
            if(e.request.mode==='navigate'){
              e.respondWith(fetch(e.request,{cache:'no-store'}).then(r=>{const c=r.clone();caches.open(CACHE).then(x=>x.put('/index.html',c));return r}).catch(()=>caches.match('/index.html')));return;
            }
            if(u.origin===location.origin){
              e.respondWith(caches.match(e.request).then(c=>c||fetch(e.request,{cache:'no-store'}).then(r=>{const copy=r.clone();caches.open(CACHE).then(x=>x.put(e.request,copy));return r})));
            }
          });
          """
          Path('pwa/sw.js').write_text('\n'.join(line.strip() for line in sw.splitlines() if line.strip()) + '\n', encoding='utf-8')
          PY

      - name: Syntax checks
        run: npm run check

      - name: Structural checks
        shell: bash
        run: |
          grep -q 'app-test4.css?v=test4-1' pwa/index.html
          grep -q 'app-test4.js?v=test4-1' pwa/index.html
          grep -q 'PWA Test 4' pwa/index.html
          grep -q "const VERSION_NAME = 'PWA Test 4';" pwa-server-test2.js
          grep -q 'const VERSION_CODE = 4;' pwa-server-test2.js
          grep -q "alefatemion-pwa-test4-v1" pwa/sw.js
          ! grep -q 'app-parity3' pwa/index.html

      - name: Smoke server
        shell: bash
        run: |
          npm start >/tmp/pwa-test4.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/tmp/health.json; then break; fi
            sleep 0.5
          done
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"version":"PWA Test 4"' /tmp/health.json
          grep -q '"version_code":4' /tmp/health.json
          curl -fsS http://127.0.0.1:3000/ | grep -q 'app-test4.js?v=test4-1'

      - name: Commit finalized files
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No metadata changes to commit.'
          else
            git config user.name 'Fixit'
            git config user.email 'fixi82896@gmail.com'
            git add package.json pwa-server-test2.js pwa/sw.js
            git commit -m 'PWA Test 4: finalize runtime metadata and cache'
            git push origin HEAD:pwa-test4-clean-parity-20260928
          fi

      - name: Build Liara package
        shell: bash
        run: |
          rm -rf release-test4
          mkdir release-test4
          cp package.json liara.json pwa-server-test2.js pwa-radio-resolver.js release-test4/
          cp -R pwa release-test4/pwa
          cp -R docs release-test4/docs
          cd release-test4
          zip -qr ../Alefatemion-PWA-Test4-Clean-Liara.zip .
          cd ..
          unzip -t Alefatemion-PWA-Test4-Clean-Liara.zip

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Alefatemion-PWA-Test4-Clean-Liara
          path: Alefatemion-PWA-Test4-Clean-Liara.zip
          retention-days: 3
