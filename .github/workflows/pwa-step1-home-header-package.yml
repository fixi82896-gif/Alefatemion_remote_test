name: PWA Step 1 - Home Header Package

on:
  push:
    branches:
      - pwa-step1-home-header-20260928
    paths:
      - '.github/workflows/pwa-step1-home-header-package.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Step 1 branch
        uses: actions/checkout@v4
        with:
          ref: pwa-step1-home-header-20260928

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate unchanged runtime JavaScript
        shell: bash
        run: |
          set -euo pipefail
          npm run check

      - name: Verify Step 1 scope
        shell: bash
        run: |
          set -euo pipefail
          test -s pwa/app-step1-home-header.css
          grep -q 'app-step1-home-header.css?v=step1-1' pwa/index.html
          grep -q 'welcome-wave' pwa/index.html
          grep -q 'alefatemion-pwa-step1-v1' pwa/sw.js
          grep -q '.topbar{display:none!important}' pwa/app-step1-home-header.css

      - name: Smoke server
        shell: bash
        run: |
          set -euo pipefail
          PWA_IDENTITY_BASE_URL=https://identity-test.alefatemion.ir node pwa-server-test2.js > /tmp/pwa-step1.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3000/ >/tmp/index.html; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:3000/ | grep -q 'app-step1-home-header.css?v=step1-1'
          curl -fsS http://127.0.0.1:3000/app-step1-home-header.css | grep -q 'PWA Step 1'
          curl -fsS http://127.0.0.1:3000/api/health | tee /tmp/health.json
          grep -q 'identity-test.alefatemion.ir' /tmp/health.json

      - name: Build clean Liara package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy-package
          mkdir -p deploy-package/pwa deploy-package/docs/assets
          cp package.json deploy-package/
          cp liara.json deploy-package/
          cp pwa-server-test2.js deploy-package/
          cp pwa-radio-resolver.js deploy-package/
          cp pwa/app-account.js deploy-package/pwa/
          cp pwa/app-auth.js deploy-package/pwa/
          cp pwa/app-content.js deploy-package/pwa/
          cp pwa/app-core.js deploy-package/pwa/
          cp pwa/app-platform-parity.js deploy-package/pwa/
          cp pwa/app-radio.js deploy-package/pwa/
          cp pwa/app-test2.css deploy-package/pwa/
          cp pwa/app-step1-home-header.css deploy-package/pwa/
          cp pwa/app.css deploy-package/pwa/
          cp pwa/icon.svg deploy-package/pwa/
          cp pwa/index.html deploy-package/pwa/
          cp pwa/manifest.webmanifest deploy-package/pwa/
          cp pwa/sw.js deploy-package/pwa/
          cp docs/assets/logo_alfatemiun.webp deploy-package/docs/assets/
          (cd deploy-package && zip -qr ../Alefatemion-PWA-Step1-HomeHeader-Liara.zip .)

      - name: Verify package contents
        shell: bash
        run: |
          set -euo pipefail
          test -s Alefatemion-PWA-Step1-HomeHeader-Liara.zip
          unzip -l Alefatemion-PWA-Step1-HomeHeader-Liara.zip | grep -q 'pwa/app-step1-home-header.css'
          unzip -p Alefatemion-PWA-Step1-HomeHeader-Liara.zip pwa/index.html | grep -q 'app-step1-home-header.css?v=step1-1'
          unzip -p Alefatemion-PWA-Step1-HomeHeader-Liara.zip pwa/sw.js | grep -q 'alefatemion-pwa-step1-v1'

      - name: Upload Liara package
        uses: actions/upload-artifact@v4
        with:
          name: Alefatemion-PWA-Step1-HomeHeader-Liara
          path: Alefatemion-PWA-Step1-HomeHeader-Liara.zip
          if-no-files-found: error
          retention-days: 1
