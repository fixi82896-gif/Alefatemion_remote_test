# One-time installer for the isolated public Test remote.
name: 00 - Install Alefatemion Test Remote

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-alefatemion-test-remote
  cancel-in-progress: false

jobs:
  install-test-remote:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Test remote main branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Refuse every repository except the Test remote
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'fixi82896-gif/Alefatemion_remote_test' || {
            echo 'This installer is restricted to Alefatemion_remote_test.' >&2
            exit 1
          }

      - name: Install and verify isolated Test configuration
