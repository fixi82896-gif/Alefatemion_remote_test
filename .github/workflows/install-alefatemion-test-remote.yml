      - name: Persist only non-workflow Test remote files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app-config.json \
            .github/scripts/sync_announcements.py \
            .github/scripts/test_sync_announcements.py

          if git diff --cached --quiet; then
            echo 'Test remote ordinary files are already installed.'
          else
            git commit -m 'Initialize isolated Alefatemion Test remote'
            git push origin HEAD:main
          fi

      - name: Upload permanent synchronization workflow
        uses: actions/upload-artifact@v7
        with:
          name: Test-Remote-Permanent-Workflow
          path: dist/Test-Remote-Permanent-Workflow.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
