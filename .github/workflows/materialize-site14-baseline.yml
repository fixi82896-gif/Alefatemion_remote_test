name: Materialize Site 14 baseline

on:
  push:
    branches:
      - liara-web
    paths:
      - .github/workflows/materialize-site14-baseline.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout liara-web
        uses: actions/checkout@v4
        with:
          ref: liara-web
          fetch-depth: 0

      - name: Restore exact Site 14 text source
        shell: bash
        run: |
          set -euo pipefail
          cat .site14-bootstrap/payload.0 .site14-bootstrap/payload.1 .site14-bootstrap/payload.2 .site14-bootstrap/payload.3 > /tmp/site14-text-baseline.tar.xz.b64
          base64 -d /tmp/site14-text-baseline.tar.xz.b64 > /tmp/site14-text-baseline.tar.xz
          echo "6a644994470bacd0f26c3cfe133a7bb14762b9afa698fd426db954149abaa8a4  /tmp/site14-text-baseline.tar.xz" | sha256sum -c -
          tar -xJf /tmp/site14-text-baseline.tar.xz -C .

      - name: Materialize official Production 24.1 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          rm -f release/Alefatemion-2401.apk
          curl -fL --retry 3 --retry-delay 2 \
            'https://github.com/fixi82896-gif/Alefatemion_remote/releases/download/android-v2401/Alefatemion-2401.apk' \
            -o release/Alefatemion-2401.apk
          echo "feaaf044be840987490c3f6f6d227128d83d65111145ba80dae0603bf098aae8  release/Alefatemion-2401.apk" | sha256sum -c -
          test "$(stat -c%s release/Alefatemion-2401.apk)" = "7602740"
          test "$(git hash-object release/Alefatemion-2401.apk)" = "e8e9857c9039d9184f28e05e5e5f1279f3abf96c"
          rm -f release/Alefatemion-2100.apk

      - name: Verify exact Site 14 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object server.js)" = "a84ddff1d10144596fc5829a1de02d7467a48450"
          test "$(git hash-object docs/index.html)" = "f5817608cbcbb0322d291573e60a53a7737fe7ef"
          test "$(git hash-object docs/assets/site-vnext/site.js)" = "ba9fabc0d38940ee54e1fb65daaa713e75fb45b4"
          test "$(git hash-object package.json)" = "c76e95688bf73aea6d63c7c9cdbf67b3854d4cc8"
          test "$(git hash-object release/manifest.json)" = "c945713e53e90a58103fe7a0113f5449c93412e8"
          test "$(git hash-object DEPLOY_NOTES_FA.txt)" = "8438d7feddd062b9c98afaf57bdcc511295a2f38"
          test "$(git hash-object docs/assets/screens/hosseiniyeh.webp)" = "f0bc328d233949b0248d95f660da4a6c37800b4b"
          ! grep -q 'رادیو آل فاطمیون' docs/index.html
          grep -q 'حسینیه آل فاطمیون' docs/index.html
          grep -q "site_release:'14'" server.js

      - name: Commit official Site 14 baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .site14-bootstrap
          git rm -f .github/workflows/materialize-site14-baseline.yml
          git add -A
          git diff --cached --stat
          git commit -m 'Establish Site 14 production baseline'
          git push origin HEAD:liara-web
