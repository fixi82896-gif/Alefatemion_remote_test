name: Build Liara Site Package

on:
  push:
    branches:
      - liara-web
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout liara-web
        uses: actions/checkout@v4

      - name: Verify site-only runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check server.js
          test -f package.json
          test -f liara.json
          test -f docs/index.html
          test -f docs/privacy.html
          test -f docs/assets/icon.svg
          test -f docs/assets/logo_alfatemiun.webp
          test -f docs/assets/screens/home.webp
          test -f docs/assets/screens/albums.webp
          test -f docs/assets/screens/radio.webp
          ! grep -q "sync-remote" server.js
          ! grep -q "scripts/sync-remote" package.json

      - name: Build clean deployment directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site-bundle
          mkdir -p site-bundle/docs/assets/screens
          cp package.json server.js liara.json site-bundle/
          cp docs/index.html docs/privacy.html site-bundle/docs/
          cp docs/assets/icon.svg docs/assets/logo_alfatemiun.webp site-bundle/docs/assets/
          cp docs/assets/screens/home.webp docs/assets/screens/albums.webp docs/assets/screens/radio.webp site-bundle/docs/assets/screens/

      - name: Upload clean Liara package
        uses: actions/upload-artifact@v4
        with:
          name: alefatemion-site-liara
          path: site-bundle/
          if-no-files-found: error
          retention-days: 7
