name: Materialize official site v10 source

on:
  push:
    branches:
      - site-production-v10-materialize

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch and verify approved v10 public files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf docs
          mkdir -p docs/assets/screens docs/assets/site-vnext release

          fetch_verified() {
            url="$1"
            target="$2"
            expected="$3"
            mkdir -p "$(dirname "$target")"
            curl -L --fail --silent --show-error --retry 3 --retry-delay 2 "$url" -o "$target"
            actual="$(sha256sum "$target" | awk '{print $1}')"
            test "$actual" = "$expected" || { echo "SHA mismatch: $target" >&2; exit 1; }
          }

          fetch_verified 'https://alefatemion.ir/' 'docs/index.html' '1568e72aa584a07134c800fec97daf1bdf805fb84612d873cac7a1d5f78d0872'
          fetch_verified 'https://alefatemion.ir/privacy.html' 'docs/privacy.html' '894f40d696b61f7931560e89229b977627e922b60800ae6810d32927e5e3fc4a'
          fetch_verified 'https://alefatemion.ir/404.html' 'docs/404.html' 'f30574a875e3b82c33b9cd7e677490da764ccefd1a410ca40e3afe05107f5072'
          fetch_verified 'https://alefatemion.ir/500.html' 'docs/500.html' '8f1492b90ecda2ec0d17ffd98200059dddd0bf3d2ae5a3b29312f09f840c193d'
          fetch_verified 'https://alefatemion.ir/robots.txt' 'docs/robots.txt' '33c0687b8996a64b11240eac979d00b9ce09a7a8d18ffeab8c044f4ea4e9bd42'
          fetch_verified 'https://alefatemion.ir/sitemap.xml' 'docs/sitemap.xml' '5e84b906c87cff93f8bc4c2a287abcca7d623ad7838c40d41a77792ae99aec8f'
          fetch_verified 'https://alefatemion.ir/assets/icon.svg?v=20260925-v9' 'docs/assets/icon.svg' '13ec7f8fa499b5f5e6bee9b5668935cd8d3d94f66e7acf77dec31bdd78db5071'
          fetch_verified 'https://alefatemion.ir/assets/logo_alfatemiun.webp?v=20260925-v9' 'docs/assets/logo_alfatemiun.webp' 'a5e46106afd93e274f4c1d6e1c5a5826242a12418daaed8326d3009d9dc568b3'
          fetch_verified 'https://alefatemion.ir/assets/screens/albums.webp' 'docs/assets/screens/albums.webp' '2804e2f584dda8d8d40925d1a6726554e6a4a262359e198bf0c6c3559a8f290c'
          fetch_verified 'https://alefatemion.ir/assets/screens/home.webp' 'docs/assets/screens/home.webp' '9dda9636f31e07c32050f78987a04782e5597ce26662be2e4e01dcc1f80e478f'
          fetch_verified 'https://alefatemion.ir/assets/screens/radio.webp' 'docs/assets/screens/radio.webp' '976e3b91b3490f6d72e6e8333d92e9f00ac05beeaac2ab3818ba0dbebd1a1d6c'
          fetch_verified 'https://alefatemion.ir/assets/site-vnext/android-download-qr.png?v=20260925-v9' 'docs/assets/site-vnext/android-download-qr.png' '2c04a5a0acd559919676a08fe856836c079e7298a538e181b57f84ed0a009b0c'
          fetch_verified 'https://alefatemion.ir/assets/site-vnext/banner-activities-green.jpg?v=20260925-v9' 'docs/assets/site-vnext/banner-activities-green.jpg' 'f0a9a0ce011dfaae5640a997233131b890926a5e6f718eca09567b5ca14e3277'
          fetch_verified 'https://alefatemion.ir/assets/site-vnext/banner-hero-red.png?v=20260925-v9' 'docs/assets/site-vnext/banner-hero-red.png' 'f11be5fadfead2111c3e188d8e118bd3bcda48fb34114876f0d7a4211a466d1c'
          fetch_verified 'https://alefatemion.ir/assets/site-vnext/site.css?v=20260925-v9' 'docs/assets/site-vnext/site.css' '952db966312faabbbea5664deeca35667464f2a692c05e899ae34be16a85a375'
          fetch_verified 'https://alefatemion.ir/assets/site-vnext/site.js?v=20260925-v9' 'docs/assets/site-vnext/site.js' 'b1f6e8e0cd7697ea6b1a2103cb0cc8d031f94c6411c3dca8901424c84f11efdf'
          fetch_verified 'https://github.com/fixi82896-gif/Alefatemion_remote/releases/download/android-v2100/Alefatemion-2100.apk' 'release/Alefatemion-2100.apk' '1775bfb0d26bf5828b2741f6e84efe035ee7f432ddb545a9c75a869c0ca4828a'

          echo '7eed632e2781938b198a56b6f591549ec6407b1200928ff6a4f3518379af3528  server.js' | sha256sum --check --strict
          echo '53f73cc7adffa9f1968050a12784083009ff1fc8fe68f97513a9a3ffd7e42175  package.json' | sha256sum --check --strict
          echo 'eb40fc363fa730a8749a4c9c40369a3b0f98eda970ebed1208bf3e10efaedcc5  liara.json' | sha256sum --check --strict
          echo 'e1d6aae48e0793c9ece82ddb963a70d6c2758a909c9467baa3d6f087493e603b  release/manifest.json' | sha256sum --check --strict

      - name: Commit verified v10 materialization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js package.json liara.json docs release
          git commit -m "Materialize verified Production site v10 source"
          git push origin HEAD:site-production-v10-materialize