name: One-time localize Test banner asset

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/one-time-localize-production-asset.yml"

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Test remote
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download and verify exact Production asset
        shell: bash
        run: |
          set -euo pipefail
          file="intro-background-e0daceefe1c2ba6b3f0e.png"
          url="https://github.com/fixi82896-gif/Alefatemion_remote/releases/download/remote-assets-v1/${file}"
          curl --fail --location --retry 3 --output "$file" "$url"
          expected="e0daceefe1c2ba6b3f0ea9c7d51d0886aa277e9cc938627598343a9f67714110"
          actual="$(sha256sum "$file" | awk '{print $1}')"
          test "$actual" = "$expected"

      - name: Upload exact asset to Test release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          file="intro-background-e0daceefe1c2ba6b3f0e.png"
          gh release upload remote-assets-v1 "$file" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Point Test config to Test-owned asset without overwriting concurrent changes
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 - <<'PY'
          from pathlib import Path
          import json

          path = Path("app-config.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          filename = "intro-background-e0daceefe1c2ba6b3f0e.png"
          target = (
              "https://github.com/fixi82896-gif/Alefatemion_remote_test/"
              "releases/download/remote-assets-v1/" + filename
          )

          matches = 0
          for banner in data.get("home", {}).get("banners", []):
              current = str(banner.get("image_url", ""))
              if filename in current:
                  if "fixi82896-gif/Alefatemion_remote/" not in current:
                      raise SystemExit(
                          "Target banner exists but no longer points to Production"
                      )
                  banner["image_url"] = target
                  matches += 1

          if matches != 1:
              raise SystemExit(
                  f"Expected exactly one target banner, found {matches}"
              )

          revision = int(data.get("revision", 0))
          if revision < 0:
              raise SystemExit("Invalid top-level revision")
          data["revision"] = revision + 1

          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-config.json
          git diff --cached --check
          git commit -m "Keep Test banner assets independent from Production"
          git push origin HEAD:main
