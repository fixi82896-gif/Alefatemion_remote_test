<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0e4d3d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>آل فاطمیون — PWA Test 1</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="offline" class="offline hidden">اتصال اینترنت برقرار نیست؛ اطلاعات آنلاین ممکن است تازه نباشد.</div>
  <main id="auth" class="auth-shell">
    <section class="auth-card">
      <img src="/icon.svg" alt="آل فاطمیون" class="auth-logo">
      <h1>ورود به آل فاطمیون</h1>
      <p id="authHint">شماره همراه خود را وارد کنید.</p>
      <form id="phoneForm" class="stack">
        <input id="phone" inputmode="tel" autocomplete="tel" placeholder="۰۹۱۲۱۲۳۴۵۶۷" required>
        <label class="check"><input id="privacy" type="checkbox" required> <span>قوانین حریم خصوصی و استفاده از حساب را می‌پذیرم.</span></label>
        <button class="primary">ارسال کد</button>
      </form>
      <form id="otpForm" class="stack hidden">
        <input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="کد ۶ رقمی" required>
        <button class="primary">تأیید و ورود</button>
        <button type="button" id="otpBack" class="ghost">اصلاح شماره</button>
      </form>
      <form id="profileForm" class="stack hidden">
        <input id="displayName" maxlength="60" placeholder="نام نمایشی" required>
        <div class="birth-grid"><input id="birthYear" inputmode="numeric" placeholder="سال" required><input id="birthMonth" inputmode="numeric" placeholder="ماه" required><input id="birthDay" inputmode="numeric" placeholder="روز" required></div>
        <button class="primary">ذخیره پروفایل</button>
      </form>
      <div id="authError" class="error hidden"></div>
      <small class="test-badge">PWA Test 1 — محیط آزمایشی</small>
    </section>
  </main>

  <div id="app" class="app hidden">
    <header class="topbar">
      <div><small>آل فاطمیون</small><strong id="topTitle">خانه</strong></div>
      <button id="profileButton" class="avatar-btn" aria-label="پروفایل"><span id="avatarText">آل</span></button>
    </header>
    <section id="welcome" class="welcome">
      <div><strong id="welcomeName">خوش آمدید</strong><span>به نرم‌افزار آل فاطمیون</span></div>
      <button id="contactButton" class="mini">ارتباط با پشتیبانی</button>
    </section>
    <div id="view" class="view"></div>
    <nav class="bottom-nav">
      <button data-tab="home" class="active"><span>⌂</span><small>خانه</small></button>
      <button data-tab="albums"><span>▦</span><small>آلبوم‌ها</small></button>
      <button data-tab="notices"><span>◉</span><small>اطلاعیه‌ها</small></button>
      <button data-tab="favorites"><span>♥</span><small>علاقه‌مندی‌ها</small></button>
      <button id="navProfile"><span>●</span><small>پروفایل</small></button>
    </nav>
  </div>

  <div id="drawerBackdrop" class="backdrop hidden"></div>
  <aside id="drawer" class="drawer hidden">
    <div class="drawer-head"><button id="closeDrawer" class="icon-btn">×</button><div class="drawer-avatar"><span id="drawerAvatar">آل</span></div><strong id="drawerName">عضو آل فاطمیون</strong><small id="drawerPhone">—</small></div>
    <div class="drawer-actions">
      <button data-action="profile-info">اطلاعات کاربری</button>
      <button data-action="messages">پیام‌ها <span id="messageCount"></span></button>
      <button data-action="radio">رادیو</button>
      <button data-action="devices">مدیریت دستگاه‌ها</button>
      <button data-action="support">پشتیبانی</button>
      <button data-action="settings">تنظیمات</button>
      <button data-action="logout" class="danger-text">خروج</button>
    </div>
    <small class="drawer-note">مدیریت مجموعه فقط از اپ Android مدیر انجام می‌شود.</small>
  </aside>

  <div id="modalBackdrop" class="modal-backdrop hidden"></div>
  <section id="modal" class="modal hidden"><div class="modal-head"><strong id="modalTitle"></strong><button id="closeModal" class="icon-btn">×</button></div><div id="modalBody"></div></section>
  <audio id="audio" preload="none"></audio>
  <div id="toast" class="toast hidden"></div>
  <script src="/app.js" defer></script>
</body>
</html>
